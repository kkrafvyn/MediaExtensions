<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark Studio Mesh -->
    <radialGradient id="repairGlow1" cx="85%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#064e3b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#09120e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="repairGlow2" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#09120e" stop-opacity="0" />
    </radialGradient>
    <pattern id="pcbGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="1.5" fill="#ffffff" fill-opacity="0.08"/>
      <path d="M 0 40 L 35 40 M 45 40 L 80 40 M 40 0 L 40 35 M 40 45 L 40 80" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="#0a130f"/>
  <rect width="1920" height="1080" fill="url(#pcbGrid)"/>
  <rect width="1920" height="1080" fill="url(#repairGlow1)"/>
  <rect width="1920" height="1080" fill="url(#repairGlow2)"/>

  <!-- Futuristic PCB / Device Circuitry Traces -->
  <g opacity="0.25" stroke="#10b981" stroke-width="1.5" fill="none">
    <!-- Traces right -->
    <path d="M 1200,200 L 1400,200 L 1450,250 L 1700,250" />
    <circle cx="1700" cy="250" r="4" fill="#10b981" />
    
    <path d="M 1300,150 L 1500,150 L 1560,210 L 1800,210" stroke="#f6c258"/>
    <circle cx="1800" cy="210" r="4" fill="#f6c258" />

    <path d="M 1150,350 L 1350,350 L 1420,420 L 1650,420" />
    <circle cx="1650" cy="420" r="4" fill="#10b981" />

    <!-- Chip silhouette -->
    <rect x="1350" y="480" width="220" height="220" rx="16" fill="#0d1c15" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="1380" y="510" width="160" height="160" rx="8" fill="#13271d" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="1460" y="595" fill="#10b981" fill-opacity="0.5" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">GSM BIONIC</text>
  </g>
</svg>
