name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests (no DATABASE_URL)
        run: npm run test -w server
        env:
          SKIP_INTEGRATION: "1"
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
      - name: Production check (env-only, no DB)
        run: npm run production-check -w server
        env:
          SKIP_CATALOG_CHECK: "1"
        continue-on-error: true
